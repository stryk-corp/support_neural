[project]
name = "supportbot"
version = "1.0.0"
description = "Standalone, embeddable customer-support service"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.coverage.run]
source = ["supportbot"]
relative_files = true

[tool.coverage.report]
show_missing = true
